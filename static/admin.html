<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DevIAs Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
/* DevIAs Panel · sistema de diseño: neutros fríos con tinte azul, un solo acento (índigo), Inter para todo, tarjetas de 12 px con borde fino y sombra suave solo donde hay elevación */
:root{--bg:#f5f6f8;--card:#fff;--side:#fbfbfc;--line:#e7e9ee;--line2:#d5d9e1;--tx:#11151c;--tx2:#576175;--tx3:#8892a3;--acc:#4561e8;--acc2:#3a52cc;--accbg:#eef1fe;--ok:#0f7a5a;--okbg:#e4f5ee;--warn:#955a00;--warnbg:#fff1d6;--bad:#b42318;--badbg:#fdeceb;--neu:#eef0f4;--r:12px;--sh1:0 1px 2px rgba(17,21,28,.05);--sh2:0 10px 30px rgba(17,21,28,.10);--font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0c11;--card:#11141b;--side:#0d1016;--line:#1e232e;--line2:#2b3240;--tx:#eceff5;--tx2:#9ba5b7;--tx3:#667085;--acc:#8095ff;--acc2:#97a8ff;--accbg:#171f45;--ok:#4cc9a0;--okbg:#10291f;--warn:#f0c15a;--warnbg:#2c2410;--bad:#ff8f86;--badbg:#341716;--neu:#1a1e28;--sh1:0 1px 2px rgba(0,0,0,.4);--sh2:0 10px 30px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0c11;--card:#11141b;--side:#0d1016;--line:#1e232e;--line2:#2b3240;--tx:#eceff5;--tx2:#9ba5b7;--tx3:#667085;--acc:#8095ff;--acc2:#97a8ff;--accbg:#171f45;--ok:#4cc9a0;--okbg:#10291f;--warn:#f0c15a;--warnbg:#2c2410;--bad:#ff8f86;--badbg:#341716;--neu:#1a1e28;--sh1:0 1px 2px rgba(0,0,0,.4);--sh2:0 10px 30px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.55 var(--font);font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:2px solid transparent;background-clip:content-box}::-webkit-scrollbar-track{background:transparent}
a{color:var(--acc);text-decoration:none}
button{font:inherit;font-weight:500;cursor:pointer;border:1px solid var(--line2);background:var(--card);color:var(--tx);border-radius:9px;padding:0 14px;height:34px;display:inline-flex;align-items:center;gap:7px;box-shadow:var(--sh1);transition:background .15s,border-color .15s,transform .05s}
button:hover{background:var(--neu)}button:active{transform:translateY(1px)}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 1px 2px rgba(69,97,232,.35)}button.pri:hover{background:var(--acc2);border-color:var(--acc2)}
:root[data-theme="dark"] button.pri{color:#0a0c11}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.pri{color:#0a0c11}}
button.mini{height:28px;padding:0 10px;font-size:12.5px;border-radius:8px}button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.nav:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line2);border-radius:9px;padding:0 11px;height:36px;width:100%;transition:border-color .15s,box-shadow .15s}
textarea{min-height:92px;padding:9px 11px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent);outline:none}
label{display:block;font-size:12.5px;font-weight:500;color:var(--tx2);margin:12px 0 5px}
#app{display:grid;grid-template-columns:252px 1fr;height:100vh}
#side{background:var(--side);border-right:1px solid var(--line);padding:18px 12px 14px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.logo{display:flex;align-items:center;gap:11px;padding:2px 8px 18px}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,var(--acc),var(--acc2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 8px color-mix(in srgb,var(--acc) 40%,transparent)}
.logo span{display:flex;flex-direction:column;line-height:1.15;font-weight:650;font-size:15px;letter-spacing:-.01em}.logo small{font-weight:400;font-size:11.5px;color:var(--tx3);letter-spacing:0}
.grp{font-size:11px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.07em;padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:11px;padding:0 10px;height:36px;border-radius:9px;color:var(--tx2);cursor:pointer;border:0;background:none;width:100%;text-align:left;font-weight:500;box-shadow:none;transition:background .12s,color .12s}
.nav:hover{background:var(--neu);color:var(--tx)}.nav.on{background:var(--accbg);color:var(--acc);font-weight:600}.nav i{font-size:18px;flex:0 0 18px}.sep{height:1px;background:var(--line);margin:10px 6px}
#main{display:flex;flex-direction:column;min-width:0;height:100vh}
#top{display:flex;align-items:center;gap:14px;padding:0 28px;height:68px;flex:0 0 68px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(8px)}
#top h1{margin:0;font-size:19px;font-weight:650;letter-spacing:-.015em}#top small{display:block;color:var(--tx2);font-size:12.5px;margin-top:1px}#top .chips{margin-left:auto;display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--neu);color:var(--tx2);white-space:nowrap;border:1px solid transparent}
.chip.ok,.chip.warn,.chip.bad,.chip.acc{border-color:color-mix(in srgb,currentColor 18%,transparent)}.chip.ok::before,.chip.warn::before,.chip.bad::before,.chip.acc::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.acc{background:var(--accbg);color:var(--acc)}
#content{flex:1;overflow:auto;padding:26px 28px 40px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:24px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh1)}.kpi small{color:var(--tx2);font-size:12.5px;font-weight:500}.kpi b{display:block;font-size:30px;font-weight:650;line-height:1.15;margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:20px;overflow:hidden;box-shadow:var(--sh1)}
.panel>header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}.panel>header h2{margin:0;font-size:14.5px;font-weight:650;letter-spacing:-.005em}.panel>header .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.panel .body{padding:16px 18px}
table{width:100%;border-collapse:collapse}th{font-size:11.5px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:10px 18px;background:var(--side);border-bottom:1px solid var(--line)}td{padding:12px 18px;border-top:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}th+th,td+td{}td.r,th.r{text-align:right}tbody tr:hover td{background:var(--side)}
.seg{display:inline-flex;background:var(--neu);padding:3px;border-radius:10px;gap:2px}.seg button{border:0;border-radius:8px;background:transparent;color:var(--tx2);height:28px;box-shadow:none}.seg button:hover{background:transparent;color:var(--tx)}.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh1)}
.steps{display:flex;align-items:center;gap:10px;margin:2px 0 18px}.st{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:500;color:var(--tx3)}.st b{width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;background:var(--card)}.st.done{color:var(--tx2)}.st.done b{background:var(--okbg);color:var(--ok);border-color:transparent}.st.now{color:var(--tx);font-weight:600}.st.now b{background:var(--acc);color:#fff;border-color:var(--acc)}.stl{flex:0 0 30px;height:1px;background:var(--line2)}
.vid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:20px;align-items:start}@media(max-width:1100px){.vid2{grid-template-columns:1fr}}
video{width:100%;background:#000;border-radius:var(--r);max-height:62vh;box-shadow:var(--sh2)}video.v{max-width:340px;display:block;margin:0 auto}
#cap{min-height:46px;margin-top:10px;padding:9px 14px;border-radius:10px;background:var(--neu);font-size:13px;color:var(--tx);display:flex;align-items:center}
.fr{display:flex;align-items:flex-start;gap:12px;padding:10px 16px;border-top:1px solid var(--line);cursor:pointer;transition:background .12s}.fr:first-child{border-top:0}.fr:hover{background:var(--side)}.fr.now{background:var(--accbg);box-shadow:inset 3px 0 0 var(--acc)}.fr .t{color:var(--tx3);min-width:40px;font-size:12px;padding-top:2px;font-variant-numeric:tabular-nums}.fr .x{flex:1;font-size:13.5px}.fr .s{font-size:11.5px;margin-top:3px}
.idea{display:flex;align-items:flex-start;gap:14px;padding:14px 18px;border-top:1px solid var(--line);transition:background .12s}.idea:first-child{border-top:0}.idea:hover{background:var(--side)}.idea .x{flex:1;min-width:0}.idea b{font-weight:600}.idea small{color:var(--tx2);display:block;margin-top:2px}
.thumbs{display:flex;flex-wrap:wrap;gap:10px}.thumbs img{border-radius:10px;border:2px solid var(--line);cursor:pointer;object-fit:cover;background:var(--neu)}.thumbs img.on{border-color:var(--ok);box-shadow:0 0 0 3px var(--okbg)}
#jobbar{display:flex;align-items:center;gap:14px;padding:0 28px;height:46px;flex:0 0 46px;border-top:1px solid var(--line);background:var(--card);font-size:13px}#jobbar .bar{flex:1;height:6px;border-radius:4px;background:var(--neu);overflow:hidden}#jobbar .bar i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .6s}
.muted{color:var(--tx2)}.empty{padding:34px 20px;text-align:center;color:var(--tx3)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.note{font-size:12.5px;color:var(--tx3);margin-top:6px}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:center;padding:28px 30px}.hero h2{margin:0 0 6px;font-size:22px;font-weight:650;letter-spacing:-.02em}.hero p{margin:0 0 16px;color:var(--tx2);max-width:46ch}
.pasos{display:grid;gap:12px}.paso{display:flex;gap:14px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--side)}.paso b{flex:0 0 26px;height:26px;border-radius:50%;background:var(--accbg);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:12.5px}.paso span{display:block;font-weight:600}.paso small{color:var(--tx2)}
@media(max-width:900px){#app{grid-template-columns:64px 1fr}.nav span,.logo span,.grp{display:none}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.hero{grid-template-columns:1fr}#content{padding:18px 16px 32px}#top{padding:0 16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div id="app">
 <nav id="side">
  <div class="logo"><i class="ti ti-hexagon-letter-d"></i><span>DevIAs Panel<small>Estudio de video con plugins</small></span></div>
  <div class="grp">Producción</div>
  <button class="nav on" data-act="nav" data-p="inicio"><i class="ti ti-layout-dashboard"></i><span>Inicio</span></button>
  <button class="nav" data-act="nav" data-p="ideas"><i class="ti ti-bulb"></i><span>Ideas</span></button>
  <button class="nav" data-act="nav" data-p="videos"><i class="ti ti-movie"></i><span>Mis videos</span></button>
  <button class="nav" data-act="nav" data-p="voces"><i class="ti ti-microphone"></i><span>Voces</span></button>
  <button class="nav" data-act="nav" data-p="publicar"><i class="ti ti-send"></i><span>Publicar</span></button>
  <div class="grp">Operación</div>
  <button class="nav" data-act="nav" data-p="trabajos"><i class="ti ti-activity"></i><span>Trabajos</span></button>
  <button class="nav" data-act="nav" data-p="pedidos"><i class="ti ti-message-circle"></i><span>Pedidos</span></button>
  <button class="nav" data-act="nav" data-p="referencias"><i class="ti ti-bookmarks"></i><span>Referencias</span></button>
  <div style="flex:1"></div>
  <div class="grp">Plataforma</div>
  <button class="nav" data-act="nav" data-p="ajustes"><i class="ti ti-settings"></i><span>Ajustes</span></button>
 </nav>
 <section id="main">
  <header id="top"><div><h1 id="ttl">Inicio</h1><small id="sub">Resumen de tu producción</small></div><div class="chips" id="chips"></div></header>
  <div id="content"></div>
  <footer id="jobbar"></footer>
 </section>
</div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,b){try{const r=await fetch(p,b===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});return await r.json()}catch(e){return{error:'Sin respuesta del servidor'}}}
const S={p:'inicio',fmt:'short',proy:[],cat:[],ped:[],jobs:[],est:{},sel:null,guion:[],filtro:'todos',vista:'final',cur:-2,pubId:null,pubD:null,pubC:null,capSel:{},refs:[],mem:null};
const TIT={inicio:['Inicio','Resumen de tu producción'],ideas:['Ideas','Pide ideas nuevas y elige cuál hacer'],videos:['Mis videos','Borrador, voz y video final de cada proyecto'],voces:['Voces','Estado de la voz de cada video'],publicar:['Publicar','Título, descripción, etiquetas y miniatura de cada video'],trabajos:['Trabajos','Lo que está generando el panel'],pedidos:['Pedidos','Lo que le pediste a Claude'],ajustes:['Ajustes','Conexión y accesos'],referencias:['Referencias','Canales o videos que te inspiran y sus ejemplos']};
/* NOMBRE DEL AGENTE: si los pedidos van a Codex, todo texto que diga «Claude» (pantalla, avisos, confirmaciones) dice «Codex». Lo que lleva data-keep-claude (selector de agente, nombres de voces) no se toca. */
const AGN=()=>((S.est&&S.est.agente)==='codex'?'Codex':'Claude');
const nomAg=t=>(typeof t==='string'&&AGN()==='Codex')?t.replace(/\bClaude\b/g,'Codex'):t;
function aplicarAgente(root){if(AGN()!=='Codex'||!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>/\bClaude\b/.test(n.nodeValue)&&!(n.parentElement&&n.parentElement.closest('[data-keep-claude]'))?1:2}),L=[];while(w.nextNode())L.push(w.currentNode);L.forEach(n=>{n.nodeValue=n.nodeValue.replace(/\bClaude\b/g,'Codex')});if(root.querySelectorAll)root.querySelectorAll('[title],[placeholder]').forEach(e=>{if(e.closest('[data-keep-claude]'))return;['title','placeholder'].forEach(k=>{const v=e.getAttribute(k);if(v&&/\bClaude\b/.test(v))e.setAttribute(k,v.replace(/\bClaude\b/g,'Codex'))})})}
(function(){const c=window.confirm,a=window.alert;window.confirm=m=>c.call(window,nomAg(m));window.alert=m=>a.call(window,nomAg(m));
 new MutationObserver(ms=>{if(AGN()!=='Codex')return;ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)aplicarAgente(n);else if(n.nodeType===3&&n.parentElement&&!n.parentElement.closest('[data-keep-claude]')&&/\bClaude\b/.test(n.nodeValue))n.nodeValue=n.nodeValue.replace(/\bClaude\b/g,'Codex')}))}).observe(document.documentElement,{childList:true,subtree:true})})();
const reloj=s=>{s=Math.max(0,Math.round(s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s%60).padStart(2,'0')};const restaVivo=()=>Math.max(0,(S.est.vivo_resta||0)-Math.round((Date.now()-(S.estT||Date.now()))/1000));
const mmss=s=>{s=Math.round(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const chipE=p=>p.estado==='espera'?['En espera','warn']:p.estado==='borrador'?['Borrador','warn']:p.estado==='en_proceso'?['En proceso','acc']:(p.estado==='listo'||p.estado==='hecho')?['Final listo','ok']:[p.estado||'—',''];
const chip=(t,c)=>`<span class="chip ${c||''}">${esc(t)}</span>`;
const NJ={voz:'Generando la voz',voz_todas:'Rehaciendo toda la voz',grabar:'Grabando el video',capturas:'Sacando capturas',escena_mezcla:'Mezclando el audio',musica:'Preparando la música',unir:'Uniendo el video',unir_prev:'Uniendo la vista previa',mezclar:'Mezclando el audio',conforme:'Voz y unión del video'};const nombreJob=j=>{let l=(j.log&&j.log[0]||'').replace(/=/g,'').trim();if(/^\$|[A-Za-z]:\|\.py\b/.test(l))l='';return l||NJ[j.tipo]||j.tipo};
const fecha=p=>Math.max(p.unido_t||0,p.mudo_t||0);
function topbar(){const e=S.est,mins=restaVivo(),cx=e.agente==='codex',nom=cx?'Codex':'Claude';$('#chips').innerHTML='<span data-act="irAjustesAgente" title="Quién atiende los pedidos. Cámbialo en Ajustes" style="cursor:pointer">'+chip('Atiende: '+(cx?'Codex (ChatGPT)':'Claude'),'acc')+'</span>'+((e.parados&&e.parados.length)?chip('⚠ '+nom+' parado en «'+e.parados[0].titulo.slice(0,28)+'» · '+e.parados[0].min+' min'+(!cx&&e.monitor===false?' · sin escucha: escríbele «continúa»':' · avisándole solo'),'bad'):'')+chip(e.claude?(!cx&&e.monitor===false?'Claude NO escucha (solo latido)':nom+(cx?' conectado':' escuchando'))+(mins?' · ⏱ '+reloj(mins):''):nom+' desconectado',e.claude&&(cx||e.monitor!==false)?'ok':'bad')+(cx?'':'<button class="mini" data-act="emergencia" title="Si Claude no responde: deja el aviso y lo despierta sin que escribas" style="background:#dc2626;color:#fff;border:0;border-radius:8px;padding:4px 10px;margin-left:6px;font-weight:700;cursor:pointer">🚨 Emergencia</button>')+(e.voice_studio?chip('Voice Studio encendido','warn'):'')}
function jobbar(){const r=S.jobs.find(j=>j.estado==='corriendo');if(!r){const u=S.jobs[0];$('#jobbar').innerHTML=`<i class="ti ti-activity muted"></i><span class="muted">Sin trabajos en curso${u?' · último: '+esc(nombreJob(u))+' ('+esc(u.estado)+')':''}</span>`;return}
 const pct=Math.max(2,Math.min(100,r.pct||0)),ult=(r.log&&r.log.slice(-1)[0]||'').slice(0,90);$('#jobbar').innerHTML=`<i class="ti ti-loader-2"></i><div style="flex:1;min-width:0"><div style="font-size:13px"><b>${esc(nombreJob(r))}</b> · ${pct}% <span class="muted">· ${esc(ult)}</span></div><div class="bar" style="margin-top:6px"><i style="width:${pct}%"></i></div></div><span class="muted" style="font-size:12px">${Math.round((r.transcurrido||0)/60)} min</span>`}
function tabla(lista){if(!lista.length)return '<div class="empty">No hay videos con este filtro.</div>';
 return `<table><thead><tr><th>Video</th><th>Tipo</th><th>Duración</th><th>Estado</th><th class="r">Acción</th></tr></thead><tbody>${lista.map(p=>{const [t,c]=chipE(p);return `<tr><td>${esc(p.titulo)}</td><td class="muted">${p.formato==='largo'?'Largo':'Corto'}</td><td class="muted">${mmss(p.duracion)}</td><td>${chip(t,c)}</td><td class="r"><button class="mini" data-act="abrir" data-id="${esc(p.id)}">Abrir</button></td></tr>`}).join('')}</tbody></table>`}
function listaFiltrada(){let l=[...S.proy].sort((a,b)=>fecha(b)-fecha(a));const f=S.filtro;if(f==='short')l=l.filter(p=>p.formato!=='largo');else if(f==='largo')l=l.filter(p=>p.formato==='largo');else if(f==='borrador')l=l.filter(p=>p.estado==='borrador');return l}
function rInicio(){const ideas=S.cat.filter(i=>i.estado==='idea').length,bor=S.proy.filter(p=>p.estado==='borrador').length,pro=S.proy.filter(p=>p.estado==='en_proceso').length+(S.jobs.some(j=>j.estado==='corriendo')?1:0),lis=S.proy.filter(p=>p.estado==='listo'||p.estado==='hecho').length;
 return `<div class="cards"><div class="kpi"><small>Ideas disponibles</small><b>${ideas}</b></div><div class="kpi"><small>En borrador</small><b>${bor}</b></div><div class="kpi"><small>En proceso</small><b>${pro}</b></div><div class="kpi"><small>Videos finales</small><b>${lis}</b></div></div>
